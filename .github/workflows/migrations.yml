# ============================================================
#  Every push builds the database from nothing
# ------------------------------------------------------------
#  Migrations already run on deploy: the container runs
#  migrate.php before anything listens, in both nixpacks.toml and
#  deploy/Dockerfile. That is the right place for them — the
#  database is reachable from the application and from nowhere
#  else, which is how it should stay. Running migrations against
#  production *from* GitHub would mean opening the database to
#  GitHub's runners, and a pharmacy's patient records should not
#  be reachable from a CI service on the public internet.
#
#  What was missing is the half before that. A broken migration
#  today is found by the deploy, at which point `|| true` in the
#  start command swallows it and the site comes up serving
#  yesterday's schema with a banner only an administrator sees.
#  The shop is open and subtly wrong.
#
#  So this builds the whole database from schema.sql and every
#  migration, on a real PostgreSQL, on every push. A migration
#  that cannot run never reaches the server.
#
#  It also runs them twice. Migrations are supposed to be
#  idempotent and the runner tracks what it has applied; the
#  second pass proves both, because a migration that works once
#  and fails on a re-run is a migration that breaks the next
#  deploy rather than this one.
# ============================================================

name: Database and code checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  migrations:
    name: Build the schema from nothing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myhealth
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: myhealth_ci
        ports: ['5432:5432']
        # Without this the job races the database and fails for a
        # reason that has nothing to do with the migrations.
        options: >-
          --health-cmd "pg_isready -U myhealth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none

      - name: Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Known vulnerabilities in dependencies
        # The October 2026 PHP flaws were in PHP itself, which this
        # cannot see. What it does see is the three packages this
        # application ships — dompdf, PHPMailer, phpdotenv — any of
        # which could be the next advisory, and none of which anybody
        # would notice going stale without being told.
        run: composer audit --no-interaction

      - name: The PHP2Shell check still gives the right answers
        # Asserting the logic, not the runner's own PHP. A CI runner
        # is ephemeral and serves no traffic, so failing a build over
        # its version would be noise — but a version check that has
        # quietly stopped working is worth catching, because the only
        # time anybody finds out otherwise is the day they trust it.
        run: |
          php -r '
            require "deploy/php-version-check.php";
            $cases = [
                ["8.3.36", "patched"], ["8.3.35", "vulnerable"], ["8.3.6", "vulnerable"],
                ["8.2.35", "patched"], ["8.2.34", "vulnerable"],
                ["8.4.27", "patched"], ["8.4.26", "vulnerable"],
                ["8.5.12", "patched"], ["8.5.11", "vulnerable"],
                ["8.6.0",  "patched"],          // newer than we know about
                ["8.1.99", "unsupported"],      // end of life before disclosure
                ["7.4.33", "unsupported"],
                ["8.3.6-0ubuntu0.24.04.11", "vulnerable"],   // distro suffix ignored
                ["nonsense", "unknown"],
            ];
            $bad = 0;
            foreach ($cases as [$v, $want]) {
                $got = php2shell_verdict($v)["state"];
                if ($got !== $want) {
                    fwrite(STDERR, "::error::php2shell_verdict($v) said $got, expected $want\n");
                    $bad = 1;
                }
            }
            exit($bad);
          '
          echo "Verdict logic is intact. The runner is on $(php -r 'echo PHP_VERSION;'):"
          php deploy/php-version-check.php || echo "::warning::This CI runner is on a PHP that still has PHP2Shell. That does not affect the build, but check what your servers are running."

      - name: Syntax-check every PHP file
        # Cheap, and catches the parse error that would otherwise
        # take the site down on deploy rather than here.
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Build the schema
        env:
          PGPASSWORD: ci-not-a-secret
        run: |
          psql -h localhost -U myhealth -d myhealth_ci -v ON_ERROR_STOP=1 \
               -q -f database_structure/schema.sql

      - name: Apply every migration
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: myhealth_ci
          DB_USER: myhealth
          DB_PASS: ci-not-a-secret
          MIGRATE_DB_WAIT: '30'
        run: php database_structure/migrate.php

      - name: Apply them again — nothing should move
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: myhealth_ci
          DB_USER: myhealth
          DB_PASS: ci-not-a-secret
        run: |
          out=$(php database_structure/migrate.php)
          echo "$out"
          echo "$out" | grep -q "Everything already up to date" || {
            echo "::error::A second run applied something. Migrations are not idempotent,"
            echo "::error::so the next deploy will try to apply it again."
            exit 1
          }

      - name: The invariants the schema is supposed to enforce
        # These are the rules that live in the database rather than
        # in PHP, so PHP cannot be what proves them. Each one is
        # written here as the attack on it: if the constraint is
        # ever dropped, this step fails instead of the books
        # quietly going out of balance.
        env:
          PGPASSWORD: ci-not-a-secret
        run: |
          set -e
          q() { psql -h localhost -U myhealth -d myhealth_ci -v ON_ERROR_STOP=1 -tAc "$1"; }

          CASH=$(q "SELECT account_id FROM accounts WHERE code='1110'")
          SALE=$(q "SELECT account_id FROM accounts WHERE code='4100'")
          HEAD=$(q "SELECT account_id FROM accounts WHERE code='1000'")

          echo "An unbalanced journal entry must be refused"
          if q "BEGIN;
                WITH e AS (INSERT INTO journal_entries (entry_number, entry_date)
                           VALUES ('CI-UNBAL', CURRENT_DATE) RETURNING entry_id)
                INSERT INTO journal_lines (entry_id, account_id, debit, credit)
                SELECT e.entry_id, a.account_id,
                       CASE WHEN a.code='1110' THEN 100 ELSE 0 END,
                       CASE WHEN a.code='4100' THEN 90  ELSE 0 END
                  FROM e, accounts a WHERE a.code IN ('1110','4100');
                COMMIT;" 2>/dev/null; then
            echo "::error::An unbalanced entry was accepted. The balance trigger is gone."
            exit 1
          fi

          echo "Posting to a heading must be refused"
          if q "BEGIN;
                WITH e AS (INSERT INTO journal_entries (entry_number, entry_date)
                           VALUES ('CI-HEAD', CURRENT_DATE) RETURNING entry_id)
                INSERT INTO journal_lines (entry_id, account_id, debit, credit)
                SELECT e.entry_id, a.account_id,
                       CASE WHEN a.code='1000' THEN 10 ELSE 0 END,
                       CASE WHEN a.code='4100' THEN 10 ELSE 0 END
                  FROM e, accounts a WHERE a.code IN ('1000','4100');
                COMMIT;" 2>/dev/null; then
            echo "::error::A posting to a heading account was accepted."
            exit 1
          fi

          echo "A balanced entry must be accepted"
          q "BEGIN;
             WITH e AS (INSERT INTO journal_entries (entry_number, entry_date)
                        VALUES ('CI-OK', CURRENT_DATE) RETURNING entry_id)
             INSERT INTO journal_lines (entry_id, account_id, debit, credit)
             SELECT e.entry_id, a.account_id,
                    CASE WHEN a.code='1110' THEN 100 ELSE 0 END,
                    CASE WHEN a.code='4100' THEN 100 ELSE 0 END
               FROM e, accounts a WHERE a.code IN ('1110','4100');
             COMMIT;" > /dev/null

          echo "One document cannot post twice"
          q "INSERT INTO journal_entries (entry_number, entry_date, source_table, source_id)
             VALUES ('CI-SRC-1', CURRENT_DATE, 'invoices', 424242)" > /dev/null
          if q "INSERT INTO journal_entries (entry_number, entry_date, source_table, source_id)
                VALUES ('CI-SRC-2', CURRENT_DATE, 'invoices', 424242)" 2>/dev/null; then
            echo "::error::The same document posted twice. The source index is gone."
            exit 1
          fi

          # A negative-stock check belongs here too, and is not here:
          # a database built from nothing has no products and no
          # batches, so the UPDATE matches no rows and the test passes
          # without testing anything. A check that cannot fail reads
          # like coverage and is worse than an absent one. It needs a
          # seeded batch first, which is a fixture this workflow does
          # not have yet.

          echo "All invariants held."

      - name: Every private upload folder is denied by every gatekeeper
        # These files are customers' bank details, signed agreements
        # and staff sick notes. Three different things stand in front
        # of them — the router that the nixpacks deployment actually
        # runs, nginx for the container build, and the endpoint that
        # serves them — and nginx cannot read the PHP list, so its
        # copy is written by hand.
        #
        # Adding the leave folder is what made this step necessary: it
        # went into nginx and into the endpoint and not into the
        # router, and on the live deployment a sick note was readable
        # off the disk by anybody with the URL. Two out of three is a
        # hole, and it is not the kind that announces itself.
        run: |
          set -e
          folders=$(php -r '
            require "includes/private_folders.php";
            echo implode(" ", PRIVATE_UPLOAD_FOLDERS);
          ')
          echo "declared private: $folders"

          fail=0
          for f in $folders; do
            grep -q "location \^~ /uploads/$f/" deploy/nginx-site.conf || {
              echo "::error::deploy/nginx-site.conf does not deny /uploads/$f/"
              fail=1
            }
          done

          # And the router must refuse them too. Asked of the real
          # code rather than by reading it, so a refactor that stops
          # consulting the list is caught as well.
          php -r '
            require "includes/private_folders.php";
            $bad = 0;
            foreach (PRIVATE_UPLOAD_FOLDERS as $f) {
                $_SERVER["REQUEST_URI"] = "/uploads/$f/probe.pdf";
                ob_start();
                $served = (static function () { return require "public/router.php"; })();
                ob_end_clean();
                // The router returns true when it has refused the
                // request itself, and false to let the file be served.
                if ($served !== true) {
                    fwrite(STDERR, "::error::public/router.php serves /uploads/$f/\n");
                    $bad = 1;
                }
            }
            exit($bad);
          ' || fail=1

          # And none of them may be committable. Only payments/ was
          # in .gitignore, so refund proofs, investor agreements and
          # staff advance receipts were one `git add -A` on a server
          # away from being in the repository.
          for f in $folders; do
            grep -q "^/public/uploads/$f/" .gitignore || {
              echo "::error::.gitignore does not exclude /public/uploads/$f/"
              fail=1
            }
          done

          [ "$fail" = 0 ] || exit 1
          echo "All private folders are denied by nginx and the router, and are gitignored."

      - name: What the database ended up with
        env:
          PGPASSWORD: ci-not-a-secret
        run: |
          psql -h localhost -U myhealth -d myhealth_ci -tAc \
            "SELECT count(*) || ' tables, ' ||
                    (SELECT count(*) FROM information_schema.columns
                      WHERE table_schema='public') || ' columns'
               FROM information_schema.tables WHERE table_schema='public'"
