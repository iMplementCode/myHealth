; ============================================================
;  Per-directory PHP settings
; ------------------------------------------------------------
;  session.upload_progress.enabled = 0 is the partial mitigation
;  for PHP2Shell (CVE-2026-109619, October 2026). PHP's
;  upload-progress feature runs inside PHP's own request
;  handling, before any application code, so it cannot be
;  disarmed from inside the application — it has to be switched
;  off in configuration. Nothing in this system uses it.
;
;  READ THIS BEFORE RELYING ON IT:
;
;  * It closes ONE of the two paths. CVE-2026-109618 is closed
;    only by running a patched PHP — 8.5.12, 8.4.27, 8.3.36 or
;    8.2.35 and above. There is no configuration that closes
;    both. Upgrade; this is a stop-gap for the hours in between.
;
;  * .user.ini is read by the CGI and FastCGI SAPIs — php-fpm,
;    and most shared hosting. It is NOT read by PHP's built-in
;    server, which is what nixpacks.toml currently starts, so on
;    that deployment this file does nothing at all. The container
;    in deploy/Dockerfile sets the same thing in php.ini, where
;    it does apply.
;
;  Do not guess which of those you are on. Run:
;      php deploy/php-version-check.php
;  on the server. It reports the version and the setting actually
;  in force, rather than the one that was intended.
; ============================================================

session.upload_progress.enabled = 0
