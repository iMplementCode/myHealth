# ============================================================
#  iMplement ERP — ModSecurity / OWASP CRS tuning
# ------------------------------------------------------------
#  The web application firewall. Signature matching belongs here
#  rather than inside PHP, because here it can be watched, tuned
#  and switched to detection-only without a deployment.
#
#  Install (Debian/Ubuntu, nginx):
#      apt install libnginx-mod-http-modsecurity modsecurity-crs
#      include this file after the CRS setup include
#
#  Cloudflare's managed WAF covers the same ground at the edge. If
#  you use it, this stays as the layer that still applies when
#  someone finds the origin's address — which they will.
# ============================================================

# ── Engine ──────────────────────────────────────────────────
#  Start with DetectionOnly for a week. Read the log. An ERP
#  carries text that looks like an attack — a product called
#  1/2" UNION, a note reading "SELECT the blue one" — and a rule
#  that blocks a genuine invoice gets the whole firewall turned
#  off by someone with a deadline. Tune first, then enforce.
SecRuleEngine DetectionOnly
# SecRuleEngine On          ← after tuning

SecRequestBodyAccess On
SecResponseBodyAccess Off

SecRequestBodyLimit         6291456    # 6 MB, matching the upload ceiling
SecRequestBodyNoFilesLimit  1048576    # 1 MB of actual form fields
SecRequestBodyLimitAction   Reject

SecAuditEngine RelevantOnly
SecAuditLogParts ABIJDEFHZ
SecAuditLog /var/log/modsec_audit.log

# The real client, not the CDN. Without this every block is
# attributed to Cloudflare and the IP-based rules are useless.
SecRule REQUEST_HEADERS:CF-Connecting-IP "@rx ^.*$" \
    "id:1000,phase:1,pass,nolog,capture,setvar:tx.real_ip=%{MATCHED_VAR}"

# ── Paranoia level ──────────────────────────────────────────
#  1 is the CRS default and the right starting point. 2 catches
#  more and produces false positives on free-text fields, which
#  an ERP is full of.
SecAction "id:1001,phase:1,pass,nolog,\
    setvar:tx.blocking_paranoia_level=1,\
    setvar:tx.detection_paranoia_level=1,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# ── Exclusions ──────────────────────────────────────────────
#  Every exclusion below is a hole, so each one names what it is
#  for and is scoped to the narrowest path and parameter that
#  makes the application work.

# Item lists are posted as a JSON blob by the document builder.
# The SQL-injection rules read braces, quotes and commas in it as
# an attack; it is a serialised form, and it is never concatenated
# into SQL — every query in the application binds its parameters.
SecRule REQUEST_FILENAME "@rx /(invoices|proformas|credit_notes|returns|delivery_notes|modules/(sales|purchasing))/" \
    "id:1010,phase:2,pass,nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:items_json,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:items_json"

# Free text where a customer's own words are recorded verbatim.
SecRule REQUEST_FILENAME "@rx \.php$" \
    "id:1011,phase:2,pass,nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:notes,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:description,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:terms,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:status_note,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:notes,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:description"

# Product specifications: a stored JSON document of arbitrary
# key/value pairs typed by staff.
SecRule REQUEST_FILENAME "@rx /modules/inventory/" \
    "id:1012,phase:2,pass,nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:specs_json,\
    ctl:ruleRemoveTargetByTag=attack-injection-php;ARGS:specs_json"

# Uploads are already checked by real MIME type in PHP, and the
# multipart body of a legitimate photograph trips several
# content rules on the way past.
SecRule REQUEST_HEADERS:Content-Type "@rx multipart/form-data" \
    "id:1013,phase:1,pass,nolog,\
    ctl:ruleRemoveByTag=attack-injection-generic"

# ── Rules of our own ────────────────────────────────────────
#  Things the CRS does not know are wrong here.

# The sign-in form, from an address with no session. Slower than
# nginx's limiter and aimed at the thing that matters: password
# guessing rather than request volume.
SecRule REQUEST_FILENAME "@streq /login.php" \
    "id:1020,phase:2,chain,deny,status:429,log,\
    msg:'Sign-in attempted too often from one address'"
    SecRule REQUEST_METHOD "@streq POST" "chain"
    SecRule &REQUEST_COOKIES:IMPLEMENT_ERP_SESS "@eq 0" \
        "setvar:ip.login_attempts=+1,expirevar:ip.login_attempts=300,\
         chain"
    SecRule IP:LOGIN_ATTEMPTS "@gt 25"

# Nobody has business asking for these, and the ask itself says
# what the asker is doing.
SecRule REQUEST_URI "@rx (?i)/(\.git|\.svn|\.env|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|pma|adminer|\.aws|\.ssh|id_rsa|backup\.(sql|zip|tar\.gz))" \
    "id:1021,phase:1,deny,status:404,log,\
    msg:'Scanner probing for files this application does not have'"

# A response carrying a database error is a response carrying a
# schema. Suppressed here as well as in PHP, because the two fail
# in different ways.
SecRule RESPONSE_BODY "@rx (?i)(SQLSTATE\[|PDOException|pg_query|Fatal error:|Warning: pg_|Stack trace:)" \
    "id:1022,phase:4,deny,status:500,log,\
    msg:'Internal error text was about to be returned to a client'"

# Uploads may not name a file that would execute if it were ever
# served from somewhere less careful than this.
SecRule FILES "@rx (?i)\.(php[0-9s]?|phtml|phar|pl|py|cgi|asp|aspx|jsp|sh|exe)$" \
    "id:1023,phase:2,deny,status:400,log,\
    msg:'Executable file name in an upload'"
