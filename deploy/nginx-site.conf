# ============================================================
#  myHealth — nginx inside the container
# ------------------------------------------------------------
#  deploy/nginx.conf is the configuration for a bare VPS: it
#  terminates TLS, redirects port 80 and talks to certbot. This
#  one is for a container behind a router that has already done
#  all of that — Dokploy's Traefik, or any other ingress.
#
#  So there is no TLS here and no port 80 redirect. Doing it
#  twice is how a site ends up in a redirect loop: Traefik hands
#  over plain HTTP having already served HTTPS to the visitor,
#  and an nginx that insists on redirecting sends them back round
#  for ever. HSTS is likewise the edge's job, and the application
#  sets it anyway.
#
#  What this file is for is the part the router does not do:
#  refusing to serve the files that are not pages, putting a
#  ceiling on request rates, and handing PHP to php-fpm with
#  limits on how long any one request may hold a worker.
# ============================================================

#  Rate limits, keyed on the address nginx sees. Behind Traefik
#  that is Traefik, so these are a ceiling for the whole site
#  rather than per visitor — a blunt instrument that still stops
#  one script exhausting the workers. Per-visitor limiting is the
#  application's own, which reads X-Forwarded-For and needs
#  TRUSTED_PROXIES set to mean anything.
limit_req_zone  $binary_remote_addr  zone=mh_general:10m  rate=200r/s;
limit_req_zone  $binary_remote_addr  zone=mh_login:10m    rate=30r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr  zone=mh_conn:10m;

server {
    #  APP_PORT is substituted at start-up. Not PORT, which a
    #  platform may set to something its router is not using.
    listen       ${APP_PORT} default_server;
    server_name  _;

    root  /app/public;
    index index.php;

    #  Do not advertise the version.
    server_tokens off;

    #  5 MB uploads plus form overhead. A request larger than this
    #  is refused before PHP is started rather than after it has
    #  read the body.
    client_max_body_size 6m;
    client_body_timeout  20s;
    client_header_timeout 10s;

    #  Slowloris: a connection that dribbles bytes holds a worker
    #  open. nginx closes it; the built-in PHP server would not.
    send_timeout 30s;
    keepalive_timeout 30s;

    limit_conn mh_conn 40;
    limit_req  zone=mh_general burst=200 nodelay;

    # ─── Never served ───────────────────────────────────────
    #  The application lives above the document root, so these
    #  should be unreachable anyway. Stated again because "should
    #  be" and "is" differ by one misconfigured root.
    location ~ /\.                                   { deny all; return 404; }
    location ~* /(\.env|composer\.(json|lock))$      { deny all; return 404; }
    location ^~ /includes/                            { deny all; return 404; }
    location ^~ /database_structure/                  { deny all; return 404; }
    location ^~ /vendor/                              { deny all; return 404; }
    location ^~ /deploy/                              { deny all; return 404; }
    location ^~ /docs/                                { deny all; return 404; }

    # ─── Private documents ──────────────────────────────────
    #  Payment slips, refund proofs, investor agreements. Served
    #  through documents/view.php, which checks for a session,
    #  and never straight off the disk.
    location ^~ /uploads/payments/    { deny all; return 404; }
    location ^~ /uploads/refunds/     { deny all; return 404; }
    location ^~ /uploads/investments/ { deny all; return 404; }
    location ^~ /uploads/advances/    { deny all; return 404; }

    # ─── Uploads are data, never code ───────────────────────
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        try_files $uri =404;
    }

    # ─── Sign-in gets a tighter limit ───────────────────────
    #  The application has its own lockout; this is the layer that
    #  stops the attempts reaching PHP at all.
    location = /login.php {
        limit_req zone=mh_login burst=20 nodelay;
        include /etc/nginx/fastcgi-php.conf;
    }
    location = /forgot_password.php {
        limit_req zone=mh_login burst=10 nodelay;
        include /etc/nginx/fastcgi-php.conf;
    }

    # ─── Static files ───────────────────────────────────────
    location ~* \.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # ─── Health ─────────────────────────────────────────────
    #  Not rate limited and not logged: a probe every few seconds
    #  would otherwise fill the log and eat the allowance.
    location = /health.php {
        access_log off;
        include /etc/nginx/fastcgi-php.conf;
    }

    # ─── Everything else ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include /etc/nginx/fastcgi-php.conf;
    }
}
