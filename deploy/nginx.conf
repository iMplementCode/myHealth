# ============================================================
#  iMplement ERP — nginx origin configuration
# ------------------------------------------------------------
#  The origin server, sitting behind a CDN/WAF (Cloudflare or
#  equivalent) and, optionally, a load balancer in front of
#  several copies of this.
#
#  Copy to /etc/nginx/sites-available/erp.conf, edit the marked
#  lines, then:
#
#      nginx -t && systemctl reload nginx
#
#  ── Get the certificate FIRST ───────────────────────────────
#  This file will not load until the certificate it names exists.
#  nginx reads ssl_certificate at startup and refuses outright if
#  the file is missing, so installing this before running certbot
#  leaves you with a server that will not start and an error that
#  points at TLS rather than at the order you did things in.
#
#  While the stock default site is still enabled:
#
#      certbot certonly --webroot -w /var/www/html -d erp.example.com
#
#  and only then copy this file in, drop the default, and reload.
#
#  ── If the VPS has no IPv6 ──────────────────────────────────
#  Comment out both `listen [::]` lines. nginx fails to start with
#  "Address family not supported by protocol" rather than quietly
#  skipping them. Hostinger VPSes normally do have IPv6, so they
#  are left on here.
#
#  Read alongside docs/DEPLOYMENT.md, which covers the parts that
#  are not in this file: the CDN, the WAF ruleset, DDoS
#  mitigation, and the database.
#
#  Verified against nginx 1.24 (Ubuntu 24.04) with `nginx -t`.
# ============================================================

# ── Rate limit zones ────────────────────────────────────────
#  These are http-level directives and they can stay right here.
#  Debian and Ubuntu include sites-enabled/* from inside the
#  http { } block, so a zone declared at the top of this file
#  lands in exactly the right context. Nothing needs moving to
#  conf.d — an earlier note in the deployment guide said it did,
#  and it was wrong.
#
#  $binary_remote_addr is the client as nginx sees it. Behind a
#  CDN that is the CDN, so real_ip_header below rewrites it first
#  — without that, every limit here would apply to the whole
#  internet as one visitor.

#  ── An office is one address ────────────────────────────────
#  These were set as though one address were one person. It is
#  not: a Kenyan business runs on one connection behind one NAT
#  gateway, so every desk in the building arrives here as the same
#  $binary_remote_addr.
#
#  Measured with a real browser rather than guessed. One page load
#  is FIVE requests on a cold cache — two PHP and three static —
#  and one request once the browser has the assets. So twenty
#  people clicking every five seconds is about 20 requests a
#  second cold, four warm.
#
#  Against the old rate=20r/s that is an office sitting exactly on
#  its limit on the first morning after a deployment, with the
#  burst absorbing the difference and nothing left over for
#  growing. Doubled, which is still three orders of magnitude
#  below a flood — and the limits that actually stop an attack are
#  the tight lanes below: sign-in at ten a minute, the API at two
#  a second.
limit_req_zone  $binary_remote_addr zone=erp_general:10m rate=40r/s;
limit_req_zone  $binary_remote_addr zone=erp_login:10m   rate=10r/m;
limit_req_zone  $binary_remote_addr zone=erp_api:10m     rate=2r/s;

#  Static files get their own lane. Three of the five requests in
#  a cold page load are a stylesheet or an icon that nginx answers
#  off disk without waking PHP, and each was spending the same
#  allowance as the page itself — so most of the limit was being
#  used up by the cheapest thing this server does.
limit_req_zone  $binary_remote_addr zone=erp_static:10m  rate=400r/s;

limit_conn_zone $binary_remote_addr zone=erp_conn:10m;

# ── Trust the proxy in front, and only it ───────────────────
#  Cloudflare's published ranges. Refresh them from
#  https://www.cloudflare.com/ips/ — an address left in this list
#  after Cloudflare stops using it is an address that can forge
#  its own client IP.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header   CF-Connecting-IP;

# ── Port 80: exists only to send people to 443 ──────────────
server {
    listen 80;
    listen [::]:80;
    server_name erp.example.com;          # ← your hostname

    # Certificate renewal, and nothing else.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.example.com;          # ← your hostname

    # public/, not the project root. The application lives one
    # level above and is unreachable by any request.
    root /var/www/erp/public;             # ← what the world may see
    index index.php;

    # ── TLS ─────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;

    # TLS 1.2 is the floor. 1.0 and 1.1 are withdrawn, and anything
    # that still needs them is a browser nobody should be running a
    # finance system in.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling: the browser gets the revocation answer from us
    # instead of stalling on a round trip to the CA.
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # HSTS is also sent by PHP. Both is fine and neither is
    # redundant: this one covers the static files PHP never sees.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Request limits (the origin's share of DDoS defence) ──
    #  The edge absorbs volumetric floods. What reaches here is
    #  what got through, and these keep that from turning into an
    #  outage: a burst is queued, a sustained flood is refused.
    limit_req   zone=erp_general burst=80 nodelay;
    #  Not "zone=" — that is limit_req only.
    #
    #  nginx counts only connections with a request actually being
    #  processed, so idle keep-alive does not count against this.
    #  Even so, 25 is twenty-five requests in flight from the whole
    #  building: five people clicking at the same moment, at five
    #  requests a page, reach it. This is meant to stop one client
    #  holding thousands of sockets open, which is a different
    #  number from "how many desks are there".
    limit_conn  erp_conn 300;
    limit_req_status  429;
    limit_conn_status 429;

    client_max_body_size    6m;     # matches the 5 MB upload ceiling
    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            30s;
    keepalive_timeout       30s;
    large_client_header_buffers 4 16k;

    # Slow-read and slow-write attacks (Slowloris) die on these.
    reset_timedout_connection on;

    server_tokens off;

    # ── Never serve these ───────────────────────────────────
    #  The application refuses them too. This is the layer that
    #  still holds when a PHP file is added without the guard.
    location ~ /\.              { deny all; return 404; }
    location ~* /(\.env|composer\.(json|lock)|package(-lock)?\.json)$ { deny all; return 404; }
    location ^~ /database_structure/ { deny all; return 404; }
    location ^~ /includes/      { deny all; return 404; }
    location ^~ /vendor/        { deny all; return 404; }
    location ^~ /docs/          { deny all; return 404; }
    location ^~ /deploy/        { deny all; return 404; }
    location ^~ /config/        { deny all; return 404; }

    # ── Private uploads: money, and nobody else's business ──
    #  Payment slips, refund proofs, investor agreements and staff
    #  advance receipts. These used to be served from here like any
    #  other file, which made every one of them a permanent
    #  unauthenticated URL to somebody's bank details — no attack
    #  needed, just a link forwarded once.
    #
    #  They go through /documents/view.php now, which asks for a
    #  session first. This block is what stops the old direct URLs
    #  working, including the ones already sitting in people's
    #  inboxes and browser histories.
    #  Written as four prefix blocks, not one regex, and that is
    #  load-bearing. `location ^~ /uploads/` below carries the ^~
    #  modifier, which tells nginx to stop and NOT consider regex
    #  locations once it matches. A regex rule here would therefore
    #  never be reached, and the files would go on being served — it
    #  looked like it worked, because the folders happened to be
    #  empty. These are longer prefixes than /uploads/, so nginx
    #  picks them first.
    location ^~ /uploads/payments/    { deny all; return 404; }
    location ^~ /uploads/refunds/     { deny all; return 404; }
    location ^~ /uploads/investments/ { deny all; return 404; }
    location ^~ /uploads/advances/    { deny all; return 404; }

    # ── Uploads: data, never code ───────────────────────────
    #  What is left here is public by intent: product photographs
    #  and the company logo, which appear on pages and documents
    #  that are themselves public.
    #
    #  A PHP file smuggled in as an image must not execute, and a
    #  PDF must not open in the origin's own security context.
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; return 404; }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
        # A shared cache must not hold a customer's payment slip.
        add_header Cache-Control "private, max-age=300" always;
        try_files $uri =404;
    }

    # ── Static assets: the CDN's job ────────────────────────
    #  Every URL carries ?v=<mtime>, so the content behind one
    #  never changes and it can be cached hard, at the edge and in
    #  the browser. This is where a CDN takes most of the load off
    #  the origin.
    location ~* ^/assets/.*\.(css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        #  Its own lane, and this line is what puts it there:
        #  limit_req is inherited from the server block unless a
        #  location declares its own, and there is no "off" for it.
        #  Without this, eleven cached icons spend the same
        #  allowance as the page that asked for them.
        limit_req zone=erp_static burst=800 nodelay;
        try_files $uri =404;
    }

    # ── Sign-in: the slow lane ──────────────────────────────
    location = /login.php {
        limit_req zone=erp_login burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # ← your socket
    }

    # ── API: server-to-server, so a tighter lane again ──────
    location ^~ /api/ {
        limit_req zone=erp_api burst=20 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # ← your socket
    }

    # ── The load balancer's probe ───────────────────────────
    location = /health.php {
        access_log off;
        # No limit_req here. There is no "off" for it in nginx — that
        # was a directive this file invented, and it stopped the whole
        # configuration loading. The probe inherits the server's
        # general limit instead, which is 20r/s: a load balancer
        # checking every few seconds is three orders of magnitude
        # under it.
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # ← your socket
    }

    # ── Everything else ─────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # ← your socket
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;

        # PHP only ever runs a file that exists, so a request for
        # /uploads/evil.jpg/x.php cannot reach the interpreter with
        # the image as its script.
        #
        # That protection is real but it is NOT declared here: it
        # comes from snippets/fastcgi-php.conf above, which already
        # sets fastcgi_split_path_info and try_files. Declaring them
        # again is a duplicate directive and nginx refuses to load
        # the whole configuration. If you ever drop the snippet, the
        # two lines have to come back with it.
    }

    # Anything that is not a real file and not PHP.
    location ~ /(README|CHANGELOG|LICENSE)(\.md)?$ { deny all; return 404; }
}
