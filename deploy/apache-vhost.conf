# ============================================================
#  iMplement ERP — Apache virtual host
# ------------------------------------------------------------
#  For deployments on Apache (including XAMPP, which is what the
#  development machine runs). The nginx file is the reference;
#  this is the same policy expressed for httpd.
#
#  The project also ships .htaccess files, and they are the belt
#  to this file's braces — but .htaccess is only read when
#  AllowOverride permits it, and it is ignored entirely by nginx.
#  Anything that must hold everywhere is here.
#
#  Enable:
#      a2enmod ssl headers rewrite deflate
#      a2ensite erp && apache2ctl configtest && systemctl reload apache2
# ============================================================

<VirtualHost *:80>
    ServerName erp.example.com

    # Certificate renewal, and nothing else.
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName erp.example.com
    # The document root is public/, never the project root: the
    # application, its .env and its vendor tree sit one level
    # above and no request can reach them.
    DocumentRoot /var/www/erp/public

    # ── TLS ─────────────────────────────────────────────────
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/erp.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/erp.example.com/privkey.pem

    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLUseStapling          on

    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always unset X-Powered-By
        Header unset Server
    </IfModule>

    ServerSignature Off
    ServerTokens Prod
    TraceEnable Off

    # ── The real client behind a CDN ────────────────────────
    #  Without this, every rate limit and every audit entry
    #  records the CDN instead of the visitor. Refresh the ranges
    #  from https://www.cloudflare.com/ips/.
    <IfModule mod_remoteip.c>
        RemoteIPHeader CF-Connecting-IP
        RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22
        RemoteIPTrustedProxy 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18
        RemoteIPTrustedProxy 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22
        RemoteIPTrustedProxy 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
        RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
    </IfModule>

    <Directory /var/www/erp/public>
        Options -Indexes -ExecCGI +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ── Never serve these ───────────────────────────────────
    <DirectoryMatch "^/var/www/erp/(includes|database_structure|vendor|docs|deploy|config)/">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.|^(composer\.(json|lock)|package(-lock)?\.json)$">
        Require all denied
    </FilesMatch>

    # ── Uploads: data, never code ───────────────────────────
    <Directory /var/www/erp/public/uploads>
        php_admin_flag engine off
        Options -Indexes -ExecCGI
        <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox"
            Header always set Cache-Control "private, max-age=300"
        </IfModule>
        <FilesMatch "\.(php[0-9s]?|phtml|phar|cgi|pl|py|sh)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # ── Static assets: cached hard, at the edge and in the browser ──
    #  Safe because every URL is stamped with the file's
    #  modification time, so the bytes behind one never change.
    <LocationMatch "^/assets/.*\.(css|js|woff2?|ttf|svg|png|jpe?g|gif|webp|ico)$">
        <IfModule mod_headers.c>
            Header always set Cache-Control "public, max-age=31536000, immutable"
        </IfModule>
    </LocationMatch>

    # ── Request limits ──────────────────────────────────────
    LimitRequestBody 6291456
    LimitRequestFields 60
    LimitRequestFieldSize 16380
    Timeout 30
    KeepAliveTimeout 5

    # mod_reqtimeout is what actually stops a Slowloris.
    <IfModule mod_reqtimeout.c>
        RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
    </IfModule>

    ErrorLog  ${APACHE_LOG_DIR}/erp-error.log
    CustomLog ${APACHE_LOG_DIR}/erp-access.log combined
</VirtualHost>
